naftiko: 1.0.0-alpha2
info:
  label: Dana Aftermarket API — Shipping
  description: 'Dana Aftermarket API — Shipping. 1 operations. Lead operation: Get advanced shipping notifications. Self-contained
    Naftiko capability covering one Dana business surface.'
  tags:
  - Dana
  - Shipping
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DANA_API_KEY: DANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: aftermarket-shipping
    baseUri: https://api.danaaftermarket.com
    description: Dana Aftermarket API — Shipping business capability. Self-contained, no shared references.
    resources:
    - name: shipping-notifications
      path: /shipping/notifications
      operations:
      - name: getshippingnotifications
        method: GET
        description: Get advanced shipping notifications
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orderId
          in: query
          type: string
          description: Filter by order identifier.
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.DANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: aftermarket-shipping-rest
    port: 8080
    description: REST adapter for Dana Aftermarket API — Shipping. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/shipping/notifications
      name: shipping-notifications
      description: REST surface for shipping-notifications.
      operations:
      - method: GET
        name: getshippingnotifications
        description: Get advanced shipping notifications
        call: aftermarket-shipping.getshippingnotifications
        with:
          orderId: rest.orderId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: aftermarket-shipping-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dana Aftermarket API — Shipping. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-advanced-shipping-notifications
      description: Get advanced shipping notifications
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: aftermarket-shipping.getshippingnotifications
      with:
        orderId: tools.orderId
      outputParameters:
      - type: object
        mapping: $.
