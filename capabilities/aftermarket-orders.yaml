naftiko: 1.0.0-alpha2
info:
  label: Dana Aftermarket API — Orders
  description: 'Dana Aftermarket API — Orders. 2 operations. Lead operation: Place an order. Self-contained Naftiko capability
    covering one Dana business surface.'
  tags:
  - Dana
  - Orders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DANA_API_KEY: DANA_API_KEY
capability:
  consumes:
  - type: http
    namespace: aftermarket-orders
    baseUri: https://api.danaaftermarket.com
    description: Dana Aftermarket API — Orders business capability. Self-contained, no shared references.
    resources:
    - name: orders
      path: /orders
      operations:
      - name: placeorder
        method: POST
        description: Place an order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: orders-orderId-status
      path: /orders/{orderId}/status
      operations:
      - name: getorderstatus
        method: GET
        description: Get order status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orderId
          in: path
          type: string
          description: The order identifier.
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.DANA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: aftermarket-orders-rest
    port: 8080
    description: REST adapter for Dana Aftermarket API — Orders. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/orders
      name: orders
      description: REST surface for orders.
      operations:
      - method: POST
        name: placeorder
        description: Place an order
        call: aftermarket-orders.placeorder
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/orders/{orderid}/status
      name: orders-orderid-status
      description: REST surface for orders-orderId-status.
      operations:
      - method: GET
        name: getorderstatus
        description: Get order status
        call: aftermarket-orders.getorderstatus
        with:
          orderId: rest.orderId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: aftermarket-orders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dana Aftermarket API — Orders. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: place-order
      description: Place an order
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: aftermarket-orders.placeorder
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-order-status
      description: Get order status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: aftermarket-orders.getorderstatus
      with:
        orderId: tools.orderId
      outputParameters:
      - type: object
        mapping: $.
