specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Dana
providerId: dana
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Aftermarket
  - Auto Parts
  - Drivetrain
  - eCommerce
  - Supply Chain
description: Dana is a drivetrain and aftermarket parts supplier (Spicer, Victor Reinz, Long Tractor).
  The Dana Aftermarket API is a B2B catalog / order surface offered to authorized distributors, not a
  public developer API. There is no public price list; access is granted via the distributor / dealer
  agreement.
sources:
  - https://www.dana.com/
notes: B2B-only. No public API pricing. Reconcile against the active distributor or aftermarket-channel
  agreement.
plans:
  - id: dana-distributor
    name: Authorized Distributor
    type: enterprise
    description: B2B catalog, inventory, and order APIs available to authorized Dana aftermarket distributors
      and dealers.
    entries:
      - label: Distributor agreement
        description: Access provisioned per distributor contract; no separate API fee
        name: distributor_agreement
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        domains:
          - https://api.danaaftermarket.com
        unit: 1
        price: included with distributor agreement
        userMultiplied: false
    elements:
      - name: Catalog & part lookup
      - name: Inventory check
      - name: Order placement
      - name: Dana Aftermarket API
maintainers:
  - FN: API Evangelist
    email: info@apievangelist.com
